    <!-- ==============================
         STRUCTURED DATA (tells Google
         exactly what your business is)
    ============================== -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "ProfessionalService",
      "name": "Correx Digital",
      "url": "https://correxdigital.vercel.app",
      "logo": "https://correxdigital.vercel.app/logo.png",
      "image": "https://correxdigital.vercel.app/og-image.jpg",
      "description": "Nigerian digital agency offering website design, e-commerce, branding, graphic design, and AI-powered digital solutions.",
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "NG"
      },
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": "English"
      },
      "sameAs": [
        "https://www.instagram.com/correxdigital",
        "https://twitter.com/correxdigital",
        "https://www.linkedin.com/company/correx-digital"
      ],
      "serviceArea": {
        "@type": "Place",
        "name": "Nigeria"
      },
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Digital Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Website Design & Development" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "E-Commerce Store Creation" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Branding & Visual Identity" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Graphic Design" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Landing Page Design" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Digital Transformation" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "AI-Powered Tools & Automation" }}
        ]
      }
    }
    </script>
